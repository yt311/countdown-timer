<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒數計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #18191d;
    --surface2: #22242a;
    --border: rgba(255,255,255,0.07);
    --text: #f0efe8;
    --muted: #7a7b80;
    --accent: #4a9eff;
    --warn: #f5a623;
    --danger: #ff5e5e;
    --ring-track: rgba(255,255,255,0.06);
  }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 70% 50%, rgba(74,158,255,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 20% 80%, rgba(74,158,255,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Two-column layout */
  .container {
    width: 960px;
    max-width: 98vw;
    min-height: 100vh;
    padding: 2.5rem 3rem;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 3.5rem;
  }

  .left-panel {
    flex: 0 0 320px;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
  }

  /* Divider */
  .divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Ring */
  .ring-wrap {
    position: relative;
    width: 380px;
    height: 380px;
    max-width: 42vw;
    max-height: 42vw;
  }

  .ring-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  #ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 7;
  }

  #ring-fill {
    fill: none;
    stroke: #4a9eff;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 1005.3;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1), stroke 0.6s ease;
    filter: drop-shadow(0 0 10px rgba(74,158,255,0.2));
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .time-display {
    font-family: 'DM Mono', monospace;
    font-size: 86px;
    font-weight: 300;
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1;
    transition: color 0.4s;
  }

  .phase-text {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.4s;
  }

  /* Status */
  .status-pill {
    font-size: 12px;
    padding: 5px 16px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--surface);
    letter-spacing: 0.08em;
    transition: all 0.4s;
  }

  .status-pill.warn { color: var(--warn); border-color: rgba(245,166,35,0.3); background: rgba(245,166,35,0.06); }
  .status-pill.danger { color: var(--danger); border-color: rgba(255,94,94,0.3); background: rgba(255,94,94,0.06); }
  .status-pill.ringing { color: var(--danger); border-color: rgba(255,94,94,0.5); background: rgba(255,94,94,0.1); animation: blink 0.7s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }

  /* Inputs */
  .input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 20px;
    width: 100%;
  }

  .input-group label {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .input-group input {
    width: 64px;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 300;
    color: var(--text);
    text-align: center;
  }

  .input-group input:focus { color: var(--accent); }

  .sep {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 300;
    color: var(--muted);
    padding: 0 2px;
  }

  /* Presets */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .preset {
    font-size: 12px;
    font-family: 'Sora', sans-serif;
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .preset:hover { border-color: rgba(74,158,255,0.4); color: var(--accent); background: rgba(74,158,255,0.06); }
  .preset:active { transform: scale(0.96); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .btn {
    flex: 1;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 400;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .btn:hover { background: var(--surface2); border-color: rgba(255,255,255,0.15); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: rgba(74,158,255,0.12); border-color: rgba(74,158,255,0.35); color: var(--accent); }
  .btn.primary:hover { background: rgba(74,158,255,0.2); }
  .btn.stop { background: rgba(255,94,94,0.08); border-color: rgba(255,94,94,0.25); color: var(--danger); }
  .btn.stop:hover { background: rgba(255,94,94,0.15); }

  /* Hints */
  .hints {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hint-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: all 0.4s;
  }

  .hint-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-warn { background: var(--warn); }
  .dot-danger { background: var(--danger); box-shadow: 0 0 6px rgba(255,94,94,0.5); }
  .dot-accent { background: var(--accent); }
  .hint-row.active-hint { border-color: rgba(255,255,255,0.12); color: var(--text); }

  /* Section label */
  .section-label {
    font-size: 14px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: -4px;
  }
  .footer {
    position: fixed;
    bottom: 1.2rem;
    right: 1.5rem;
    font-size: 14px;
    color: rgba(200,201,205,0.75);
    letter-spacing: 0.1em;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>

<div class="container">

  <!-- LEFT: controls -->
  <div class="left-panel">
    <div class="header">
      <h1>倒數計時器</h1>
    </div>

    <div>
      <div class="section-label" style="margin-bottom:8px">設定時間</div>
      <div class="input-group">
        <label>分</label>
        <input type="number" id="inp-min" min="0" max="99" value="5" placeholder="00">
        <span class="sep">:</span>
        <label>秒</label>
        <input type="number" id="inp-sec" min="0" max="59" value="0" placeholder="00">
      </div>
    </div>

    <div>
      <div class="section-label" style="margin-bottom:8px">快速選擇</div>
      <div class="presets">
        <button class="preset" onclick="setPreset(1)">1 分鐘</button>
        <button class="preset" onclick="setPreset(3)">3 分鐘</button>
        <button class="preset" onclick="setPreset(5)">5 分鐘</button>
        <button class="preset" onclick="setPreset(10)">10 分鐘</button>
        <button class="preset" onclick="setPreset(15)">15 分鐘</button>
        <button class="preset" onclick="setPreset(25)">25 分鐘</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="btn-start" onclick="startTimer()">▶ 開始</button>
      <button class="btn" id="btn-pause" onclick="pauseTimer()" style="display:none">⏸ 暫停</button>
      <button class="btn" id="btn-resume" onclick="resumeTimer()" style="display:none">▶ 繼續</button>
      <button class="btn stop" id="btn-stop" onclick="stopTimer()" style="display:none">■ 停止</button>
    </div>

    <div>
      <div class="section-label" style="margin-bottom:8px">提醒說明</div>
      <div class="hints">
        <div class="hint-row" id="hint3">
          <span class="hint-dot dot-warn"></span>
          剩餘 3 分鐘時響一短聲
        </div>
        <div class="hint-row" id="hint1">
          <span class="hint-dot dot-danger"></span>
          剩餘 1 分鐘時響一短聲
        </div>
        <div class="hint-row" id="hint0">
          <span class="hint-dot dot-accent"></span>
          時間到時持續長聲，按停止結束
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- RIGHT: countdown display -->
  <div class="right-panel">
    <div class="ring-wrap">
      <svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
        <circle id="ring-track" cx="170" cy="170" r="160"/>
        <circle id="ring-fill" cx="170" cy="170" r="160" stroke-dasharray="1005.3" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="display">00:00</div>
        <div class="phase-text" id="phase">設定時間後開始</div>
      </div>
    </div>
    <div class="status-pill" id="status">待機中</div>
  </div>

</div>

<script>
let totalSecs = 0, remaining = 0;
let interval = null, running = false, paused = false;
let audioCtx = null, longBeepTimer = null;
let warned3 = false, warned1 = false, alerted = false;
const CIRCUM = 1005.3;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq, dur, vol) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.45, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.start(); osc.stop(ctx.currentTime + dur);
}

function shortBeep() { beep(900, 5, 0.5); }

function startLongBeep() {
  beep(660, 0.9, 0.55);
  longBeepTimer = setInterval(() => beep(660, 0.9, 0.55), 1100);
}

function stopLongBeep() { clearInterval(longBeepTimer); longBeepTimer = null; }

function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }
function fmt(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

function updateRing(rem, total) {
  const pct = total > 0 ? rem / total : 0;
  const offset = CIRCUM * (1 - pct);
  const ring = document.getElementById('ring-fill');
  ring.style.strokeDashoffset = offset;

  let color = '#4a9eff', glow = 'rgba(74,158,255,0.2)';
  if (rem <= 60) { color = '#ff5e5e'; glow = 'rgba(255,94,94,0.25)'; }
  else if (rem <= 180) { color = '#f5a623'; glow = 'rgba(245,166,35,0.2)'; }

  ring.style.stroke = color;
  ring.style.filter = `drop-shadow(0 0 10px ${glow})`;
  document.getElementById('display').style.color = rem <= 60 ? '#ff5e5e' : rem <= 180 ? '#f5a623' : '#f0efe8';
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.className = 'status-pill' + (cls ? ' ' + cls : '');
  el.textContent = text;
}

function updateHints(rem) {
  document.getElementById('hint3').className = 'hint-row' + (rem <= 180 && rem > 60 ? ' active-hint' : '');
  document.getElementById('hint1').className = 'hint-row' + (rem <= 60 && rem > 0 ? ' active-hint' : '');
  document.getElementById('hint0').className = 'hint-row' + (alerted ? ' active-hint' : '');
}

function setPreset(m) {
  if (running) return;
  document.getElementById('inp-min').value = m;
  document.getElementById('inp-sec').value = 0;
  document.getElementById('display').textContent = pad(m) + ':00';
  document.getElementById('phase').textContent = '按開始計時';
}

function startTimer() {
  const m = parseInt(document.getElementById('inp-min').value) || 0;
  const s = parseInt(document.getElementById('inp-sec').value) || 0;
  totalSecs = m * 60 + s;
  if (totalSecs <= 0) return;
  remaining = totalSecs;
  warned3 = remaining <= 180;
  warned1 = remaining <= 60;
  alerted = false;
  running = true; paused = false;

  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-pause').style.display = '';
  document.getElementById('btn-resume').style.display = 'none';
  document.getElementById('btn-stop').style.display = '';
  document.getElementById('phase').textContent = '計時中';

  tick();
  interval = setInterval(tick, 1000);
}

function tick() {
  document.getElementById('display').textContent = fmt(remaining);
  updateRing(remaining, totalSecs);
  updateHints(remaining);

  if (!warned3 && remaining <= 180 && remaining > 0) { warned3 = true; shortBeep(); setStatus('剩餘三分鐘', 'warn'); }
  else if (!warned1 && remaining <= 60 && remaining > 0) { warned1 = true; shortBeep(); setStatus('最後一分鐘！', 'danger'); }
  else if (running && !warned3 && !warned1) { setStatus('計時中'); }

  if (remaining <= 0 && !alerted) {
    alerted = true;
    clearInterval(interval); interval = null; running = false;
    document.getElementById('phase').textContent = '時間到！';
    document.getElementById('btn-pause').style.display = 'none';
    document.getElementById('btn-resume').style.display = 'none';
    setStatus('時間到！', 'ringing');
    startLongBeep();
    return;
  }
  if (remaining > 0) remaining--;
}

function pauseTimer() {
  if (!running) return;
  clearInterval(interval); interval = null;
  running = false; paused = true;
  document.getElementById('btn-pause').style.display = 'none';
  document.getElementById('btn-resume').style.display = '';
  document.getElementById('phase').textContent = '已暫停';
  setStatus('已暫停');
}

function resumeTimer() {
  if (!paused) return;
  running = true; paused = false;
  document.getElementById('btn-pause').style.display = '';
  document.getElementById('btn-resume').style.display = 'none';
  document.getElementById('phase').textContent = '計時中';
  const rem = remaining;
  if (rem <= 60) setStatus('最後一分鐘！', 'danger');
  else if (rem <= 180) setStatus('剩餘三分鐘', 'warn');
  else setStatus('計時中');
  interval = setInterval(tick, 1000);
}

function stopTimer() {
  clearInterval(interval); interval = null;
  stopLongBeep();
  running = false; paused = false; alerted = false;
  warned3 = false; warned1 = false;
  remaining = 0; totalSecs = 0;

  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-pause').style.display = 'none';
  document.getElementById('btn-resume').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('display').textContent = '00:00';
  document.getElementById('display').style.color = '#f0efe8';
  document.getElementById('phase').textContent = '設定時間後開始';
  setStatus('待機中');

  const ring = document.getElementById('ring-fill');
  ring.style.strokeDashoffset = 0;
  ring.style.stroke = '#4a9eff';
  ring.style.filter = 'drop-shadow(0 0 6px rgba(74,158,255,0.18))';

  document.getElementById('hint3').className = 'hint-row';
  document.getElementById('hint1').className = 'hint-row';
  document.getElementById('hint0').className = 'hint-row';
}
</script>

</body>
